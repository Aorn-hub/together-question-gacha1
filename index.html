<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <title>質問ガチャ | TogetherGacha</title>
  <meta name="description" content="Together Gacha サークル内向け質問ガチャ">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="site">
    <header class="hero">
      <div class="spark spark-left">✦</div>
      <h1>質問ガチャ</h1>
      <div class="spark spark-right">✦</div>
    </header>

    <section class="gacha-section" aria-label="質問ガチャ">
      <div class="machine-wrap" id="machineWrap">
        <img class="machine" src="gacha-machine.png" alt="Together Gachaのガチャマシン">
        <div class="capsule-layer" aria-hidden="true">
          <img id="capsule" class="capsule capsule-hidden" src="capsule-closed.png" alt="">
        </div>
      </div>

      <div class="question-card" id="questionCard" aria-live="polite" aria-atomic="true">
        <span class="question-number" id="questionNumber"></span>
        <p id="questionText">ガチャを回して質問を引いてみよう！</p>
      </div>

      <button class="gacha-button" id="gachaButton" type="button">
        <span id="buttonText">ガチャを回す</span>
      </button>

      <p class="remaining" id="remaining">残り 82 問</p>
    </section>

    <section class="links">
      <button class="outline-button" id="listButton" type="button">質問一覧</button>
    </section>

    <section class="finish hidden" id="finish">
      <div class="finish-inner">
        <div class="finish-icon">🎉</div>
        <h2>すべての質問が出ました！</h2>
        <p>もう一度遊ぶ場合は、質問をリセットしてください。</p>
        <button class="gacha-button reset-button" id="resetButton" type="button">リセット</button>
      </div>
    </section>
  </main>

  <div class="modal hidden" id="listModal" role="dialog" aria-modal="true" aria-labelledby="listTitle">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-panel">
      <div class="modal-head">
        <h2 id="listTitle">質問一覧</h2>
        <button class="close-button" id="closeModal" type="button" aria-label="閉じる">×</button>
      </div>
      <p class="modal-note">全82問。番号は管理用IDです。</p>
      <ol class="question-list" id="questionList"></ol>
    </div>
  </div>

  <div class="toast hidden" id="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
